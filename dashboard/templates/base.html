<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ETL 대시보드 — databricks-pre-test-new</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#dfe3e8;--txt:#1c2733;--sub:#5b6672;
      --ok:#1a6b3c;--ng:#c0392b;--accent:#2c5aa0}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;
     background:var(--bg);color:var(--txt)}
header{background:var(--txt);color:#fff;padding:14px 22px;display:flex;
       align-items:center;gap:24px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:600}
nav a{color:#cfd8e3;text-decoration:none;margin-right:16px;font-size:13.5px}
nav a:hover{color:#fff;border-bottom:2px solid #6ea8ff}
nav a.on{color:#fff;border-bottom:2px solid #6ea8ff}
main{padding:20px 22px;max-width:1600px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;
      padding:16px 18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.card h3{font-size:13.5px;margin:14px 0 6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:#eef1f5;font-weight:600;font-size:12.5px}
code{background:#eef1f5;padding:1px 5px;border-radius:3px;font-size:12px}
pre{background:#1c2733;color:#e6edf3;padding:11px;border-radius:6px;overflow:auto;
    font-size:12px;line-height:1.5}
.ok{color:var(--ok);font-weight:600}
.ng{color:var(--ng);font-weight:600}
.mut{color:var(--sub)}
.flash{padding:9px 13px;border-radius:5px;margin-bottom:12px;font-size:13.5px}
.flash.success{background:#e3f5ea;border:1px solid #a8d9bd}
.flash.error{background:#fdeaea;border:1px solid #f0b4b4}
.flash.change{background:#eef3fb;border:1px solid #b9cdf0;color:#1f4e9c;
              font-size:13px;padding:6px 12px;margin-bottom:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:#fbfcfd}
.kpi b{display:block;font-size:21px;line-height:1.25}
.kpi span{font-size:12px;color:var(--sub)}
input,select,button{font:inherit;font-size:13px;padding:4px 7px;border:1px solid var(--line);
                    border-radius:4px;background:#fff}
button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}
.scroll{max-height:520px;overflow:auto}
fieldset{border:1px solid var(--line);border-radius:6px;margin:0 0 14px;padding:11px 13px}
legend{font-size:13px;font-weight:600;padding:0 5px}
</style>
</head>
<body>
<header>
  <h1>ETL 대시보드</h1>
  <nav>
    <a href="/" class="on">개요</a>
    <a href="/profiles">프로파일</a>
    <a href="/builder">ETL 빌더</a>
    <a href="/columns">컬럼</a>
    <a href="/table/add">신규 테이블</a>
  </nav>
  <span style="margin-left:auto;font-size:12.5px;opacity:.8">databricks-pre-test-new</span>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
